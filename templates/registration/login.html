{% extends "base.html" %}
{% block title %}Login — FinTrack{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm">
  <div class="card-body p-4">
    <h2>Welcome back</h2>
    <p class="text-muted">Sign in to your personal finance dashboard.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-dark w-100">Login</button>
    </form>
    <p class="mt-3 mb-0">New user? <a href="{% url 'register' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
