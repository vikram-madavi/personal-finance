{% extends "base.html" %}
{% block title %}Register — FinTrack{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm">
  <div class="card-body p-4">
    <h2>Create account</h2>
    <p class="text-muted">Use demo data only for this coursework version.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-dark w-100">Register</button>
    </form>
  </div>
</div>
{% endblock %}
