{% extends "base.html" %}
{% block title %}{{ title }} — FinTrack{% endblock %}
{% block content %}
<div class="form-card card shadow-sm">
<div class="card-body">
<h2>{{ title }}</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-dark">Save</button>
  <a class="btn btn-outline-secondary" href="{% url 'dashboard' %}">Cancel</a>
</form>
</div>
</div>
{% endblock %}
